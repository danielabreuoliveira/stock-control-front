<h1>Dashboard</h1>

<div class="cards">

  <div class="card">
    <h3>📦 Produtos</h3>
    <span>{{ totalProdutos }}</span>
  </div>

  <div class="card">
    <h3>📂 Categorias</h3>
    <span>{{ totalCategorias }}</span>
  </div>

  <div class="card">
    <h3>⚠ Estoque Baixo</h3>
    <span>{{ estoqueBaixo }}</span>
  </div>

  <div class="card">
    <h3>💰 Valor em Estoque</h3>
    <span>R$ {{ valorEstoque | number:'1.2-2' }}</span>
  </div>

</div>
